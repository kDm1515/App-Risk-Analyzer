<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

<header>
    <div class="header">
        <div class="d-flex align-items-center ms-3">
        <img src="{{ url_for('static', filename='images/apklogo.png') }}"
            alt="Logo"
            width="75"
            height="75"
            class="me-2">

        <h3 class="text-white m-0">
            App Risk <span class="text-info">Analyzer</span>
        </h3>
    </div>
        <div>
            <a href="/" class="btn btn-success m-3 hd_btn ">
                Home
            </a>
        </div>
        <div>
            <a href="/dashboard" class="btn btn-primary m-3 hd_btn">
                Dashboard
            </a>
        </div>
        <div>
            <a href="/history" class="btn btn-secondary m-3 hd_btn">
                History
            </a>
        </div>
        <div>
            <a href="/#contact" class="btn btn-info m-3 hd_btn">
                Contact us
            </a>
        </div>
        
    </div>
</header>

<div class="container mt-5">

<h2 class="mb-4">📊 App Risk Dashboard</h2>

<div class="row">

<div class="col-md-3">
<div class="card text-center bg-primary text-white">
<div class="card-body">
<h3>{{ stats.total }}</h3>
<p>Total Apps</p>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center bg-danger text-white">
<div class="card-body">
<h3>{{ stats.high }}</h3>
<p>High Risk</p>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center bg-warning">
<div class="card-body">
<h3>{{ stats.medium }}</h3>
<p>Medium Risk</p>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card text-center bg-success text-white">
<div class="card-body">
<h3>{{ stats.low }}</h3>
<p>Low Risk</p>
</div>
</div>
</div>

</div>

<br>

<div class="card">
<div class="card-body">

<h4>Average Risk Score</h4>

<h2>{{ stats.average }}/100</h2>

</div>
</div>

<br>

<div style="width: 350px; height: 350px; margin: auto;">
    <canvas id="pieChart"></canvas>
</div>

<script>

const ctx = document.getElementById('pieChart');

new Chart(ctx, {
    type: 'pie',

    data: {
        labels: ['High', 'Medium', 'Low'],
        datasets: [{
            data: [
                {{ stats.high }},
                {{ stats.medium }},
                {{ stats.low }}
            ]
        }]
    },

    options: {
        responsive: true,
        maintainAspectRatio: false
    }
});

</script>

<br>

<a href="/" class="btn btn-primary">
Analyze New APK
</a>


</div>

</body>

</html>
