<!DOCTYPE html>
<html>
<head>
    <title>Analysis History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>

<body>

<header>
    <div class="header">
        <div class="d-flex align-items-center ms-3">
        <img src="{{ url_for('static', filename='images/apklogo.png') }}"
            alt="Logo"
            width="75"
            height="75"
            class="me-2">

        <h3 class="text-white m-0">
            App Risk <span class="text-info">Analyzer</span>
        </h3>
    </div>
        <div>
            <a href="/" class="btn btn-success m-3 hd_btn ">
                Home
            </a>
        </div>
        <div>
            <a href="/dashboard" class="btn btn-primary m-3 hd_btn">
                Dashboard
            </a>
        </div>
        <div>
            <a href="/history" class="btn btn-secondary m-3 hd_btn">
                History
            </a>
        </div>
        <div>
            <a href="/#contact" class="btn btn-info m-3 hd_btn">
                Contact us
            </a>
            
        </div>
    </div>
</header>

<div class="container mt-5">

<h2>Analysis History</h2>

<table class="table table-bordered">

<tr>

<th>App</th>

<th>Package</th>

<th>Version</th>

<th>Score</th>

<th>Verdict</th>

</tr>

{% for app in history %}

<tr>

<td>{{ app[0] }}</td>
<td>{{ app[1] }}</td>
<td>{{ app[2] }}</td>
<td>{{ app[3] }}</td>
<td>{{ app[4] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
